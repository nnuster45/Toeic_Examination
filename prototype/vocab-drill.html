<title>TOEIC Vocab Drill</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column, styled like a TOEIC answer sheet. Choices are pencil-filled bubbles; part-of-speech colors act as category tags. */
:root {
  --paper: #F3F5F4;
  --card: #FFFFFF;
  --ink: #16213A;
  --muted: #5A6478;
  --line: #D8DDE3;
  --sheet: #1E5AA8;          /* answer-sheet print blue: accent */
  --sheet-soft: #E4ECF7;
  --pencil: #2A2D33;         /* graphite fill of a marked bubble */
  --ok: #1D8455; --ok-soft: #E2F3EA;
  --bad: #C0392F; --bad-soft: #FBE6E3;
  --hl: #FFF0A8;
  --c-n: #2F66C9; --c-v: #C8502C; --c-adj: #2E8A4E; --c-adv: #B07A0E;
  --c-prep: #7A4CC2; --c-conj: #0F8A8A; --c-pron: #C23D7E;
  --f-display: "Bricolage Grotesque", "IBM Plex Sans Thai", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0F1420; --card: #171E2C; --ink: #E6EBF3; --muted: #98A2B5; --line: #2A3446;
  --sheet: #79A7EC; --sheet-soft: #1D2A42; --pencil: #E6EBF3;
  --ok: #4CC48E; --ok-soft: #133426; --bad: #F07468; --bad-soft: #3A1C1B; --hl: #5A4A10;
  --c-n: #7FA6F0; --c-v: #F0906E; --c-adj: #6CC88A; --c-adv: #E2B24A;
  --c-prep: #B394EE; --c-conj: #4CCACA; --c-pron: #EE86B8;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0F1420; --card: #171E2C; --ink: #E6EBF3; --muted: #98A2B5; --line: #2A3446;
  --sheet: #79A7EC; --sheet-soft: #1D2A42; --pencil: #E6EBF3;
  --ok: #4CC48E; --ok-soft: #133426; --bad: #F07468; --bad-soft: #3A1C1B; --hl: #5A4A10;
  --c-n: #7FA6F0; --c-v: #F0906E; --c-adj: #6CC88A; --c-adv: #E2B24A;
  --c-prep: #B394EE; --c-conj: #4CCACA; --c-pron: #EE86B8;
  color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 720px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, summary:focus-visible { outline: 2px solid var(--sheet); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }
.label { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* ---------- header ---------- */
.brand { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.brand h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(30px, 6vw, 42px); letter-spacing: -0.02em; line-height: 1; }
.brand h1 span { color: var(--sheet); }
.brand p { color: var(--muted); font-size: 14px; }

/* ---------- home panels ---------- */
.panel { display: flex; flex-direction: column; gap: 12px; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.panel-head h2 { font-size: 17px; font-weight: 700; }

.boxes { display: grid; grid-template-columns: repeat(6, minmax(0,1fr)); gap: 6px; }
.box { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 8px 8px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.box b { font-family: var(--f-display); font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.box small { font-size: 11.5px; color: var(--muted); line-height: 1.3; }
.box .pip { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; margin-top: 6px; }
.box .pip i { display: block; height: 100%; background: var(--sheet); }
.box.b0 .pip i { background: var(--muted); }
.box.b5 { border-color: var(--ok); } .box.b5 .pip i { background: var(--ok); }
@media (max-width: 480px) { .boxes { grid-template-columns: repeat(3, minmax(0,1fr)); } }

.modes { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
@media (max-width: 520px) { .modes { grid-template-columns: 1fr; } }
.mode { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; align-items: start; }
.mode .bub { grid-row: span 2; margin-top: 2px; }
.mode strong { font-size: 15px; }
.mode span.d { font-size: 13px; color: var(--muted); line-height: 1.45; }
.mode[aria-pressed="true"] { border-color: var(--sheet); background: var(--sheet-soft); }
.mode[aria-pressed="true"] .bub { background: var(--pencil); border-color: var(--pencil); color: var(--card); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 14px; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }
.chip em { font-style: normal; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.chip[aria-pressed="true"] { border-color: var(--sheet); background: var(--sheet); color: var(--card); }
.chip[aria-pressed="true"] em { color: inherit; opacity: .8; }

.startrow { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.len { display: flex; gap: 6px; align-items: center; }
.len button { border: 1.5px solid var(--line); background: transparent; border-radius: 8px; padding: 4px 12px; font-family: var(--f-mono); font-size: 13px; }
.len button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--card); }
.btn { border: 0; border-radius: 10px; padding: 12px 22px; font-weight: 700; font-size: 15px; background: var(--sheet); color: var(--card); display: inline-flex; align-items: center; gap: 10px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--ink); border: 1.5px solid var(--line); }
.btn kbd { font-family: var(--f-mono); font-size: 11px; border: 1px solid currentColor; border-radius: 4px; padding: 0 5px; opacity: .75; font-weight: 600; }

details.info { background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
details.info summary { cursor: pointer; padding: 14px 16px; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 10px; }
details.info summary::-webkit-details-marker { display: none; }
details.info summary::after { content: "+"; font-family: var(--f-mono); color: var(--muted); }
details.info[open] summary::after { content: "–"; }
details.info .body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
.flow { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; counter-reset: s; }
.flow li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; counter-increment: s; }
.flow li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--sheet); color: var(--sheet); font-family: var(--f-mono); font-size: 12px; font-weight: 600; display: grid; place-items: center; }
.flow li p { color: var(--muted); font-size: 14px; }
.flow li b { color: var(--ink); }
.tbl-wrap { overflow-x: auto; }
table.suf { border-collapse: collapse; width: 100%; font-size: 14px; }
table.suf th, table.suf td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.suf th { font-family: var(--f-mono); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
table.suf td.sx { font-family: var(--f-mono); font-size: 13px; }
.note { font-size: 13.5px; color: var(--muted); }

/* ---------- POS tag ---------- */
.tag { display: inline-flex; align-items: center; gap: 4px; font-family: var(--f-mono); font-size: 11.5px; font-weight: 600; border-radius: 4px; padding: 1px 6px; border: 1px solid currentColor; letter-spacing: .02em; white-space: nowrap; }
.t-n { color: var(--c-n); } .t-v { color: var(--c-v); } .t-adj { color: var(--c-adj); } .t-adv { color: var(--c-adv); }
.t-prep { color: var(--c-prep); } .t-conj { color: var(--c-conj); } .t-pron { color: var(--c-pron); }

/* ---------- bubbles (answer sheet) ---------- */
.bub { width: 28px; height: 28px; flex: none; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font-family: var(--f-mono); font-size: 12px; font-weight: 600; color: var(--muted); transition: background .15s, border-color .15s; }

/* ---------- quiz ---------- */
.qbar { display: flex; align-items: center; gap: 12px; }
.qbar .track { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.qbar .track i { display: block; height: 100%; background: var(--sheet); transition: width .3s; }
.qbar .count { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
.qbar .quit { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; padding: 4px; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px clamp(16px, 4vw, 28px) 24px; display: flex; flex-direction: column; gap: 20px; box-shadow: 0 1px 0 var(--line); }
.card-meta { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.steps { display: flex; gap: 6px; align-items: center; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.steps span { padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); }
.steps span.on { border-color: var(--sheet); color: var(--sheet); }
.steps span.done { background: var(--line); border-color: var(--line); color: var(--ink); }
.retry { font-family: var(--f-mono); font-size: 11.5px; color: var(--bad); }
.word { font-family: var(--f-display); font-weight: 700; font-size: clamp(40px, 11vw, 68px); letter-spacing: -0.025em; line-height: 1; overflow-wrap: anywhere; }
.sentence { font-size: clamp(18px, 4.4vw, 22px); line-height: 1.55; font-weight: 500; }
.sentence .blank { display: inline-block; min-width: 5.5em; border-bottom: 2px solid var(--ink); text-align: center; color: var(--sheet); font-weight: 700; }

.step { display: flex; flex-direction: column; gap: 10px; }
.prompt { font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.prompt small { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.posgrid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
@media (max-width: 560px) { .posgrid { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
@media (max-width: 560px) { .opts { grid-template-columns: 1fr; } }

.opt { position: relative; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; min-width: 0; transition: border-color .15s, background .15s; }
.opt:hover:not(:disabled) { border-color: var(--ink); }
.opt:hover:not(:disabled) .bub { border-color: var(--ink); color: var(--ink); }
.opt:disabled { cursor: default; }
.opt .txt { display: flex; flex-direction: column; min-width: 0; line-height: 1.3; }
.opt .txt b { font-weight: 600; font-size: 15px; }
.opt .txt small { color: var(--muted); font-size: 12px; }
.opt .txt .en { font-family: var(--f-display); font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.opt .side { margin-left: auto; }
.opt.pos-opt .bub { font-size: 11px; }
.opt.picked .bub { background: var(--pencil); border-color: var(--pencil); color: var(--card); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .bub { background: var(--ok); border-color: var(--ok); color: var(--card); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .bub { background: var(--bad); border-color: var(--bad); color: var(--card); }
.opt.dim { opacity: .5; }

.verdict { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }

.reveal { border-top: 1px dashed var(--line); padding-top: 18px; display: flex; flex-direction: column; gap: 14px; }
.reveal .row { display: grid; grid-template-columns: 108px 1fr; gap: 12px; align-items: baseline; }
@media (max-width: 480px) { .reveal .row { grid-template-columns: 1fr; gap: 4px; } }
.reveal .row > div { min-width: 0; }
.reveal .ans { font-size: 17px; font-weight: 600; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.reveal .ex { font-size: 15px; }
.reveal .ex mark { background: var(--hl); color: inherit; padding: 0 3px; border-radius: 3px; font-weight: 600; }
.clue { font-size: 14px; }
.clue.warn { color: var(--bad); }
.clue .sx { font-family: var(--f-mono); font-weight: 600; background: var(--sheet-soft); color: var(--sheet); border-radius: 4px; padding: 0 5px; }
.fam { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.fam span { display: inline-flex; gap: 6px; align-items: center; }
.fam span.me { font-weight: 700; }
.tip { font-size: 14px; background: var(--sheet-soft); border-radius: 8px; padding: 10px 12px; }

.nextrow { display: flex; justify-content: flex-end; }

/* ---------- summary ---------- */
.score { display: flex; gap: 18px; align-items: end; flex-wrap: wrap; }
.score .big { font-family: var(--f-display); font-weight: 800; font-size: 64px; line-height: .9; font-variant-numeric: tabular-nums; }
.score .big small { font-size: 28px; color: var(--muted); font-weight: 700; }
.reslist { display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
.res { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 2fr) auto; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); align-items: center; }
.res:last-child { border-bottom: 0; }
.res .w { font-family: var(--f-display); font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
.res .m { font-size: 13.5px; color: var(--muted); }
.res .marks { display: flex; gap: 6px; font-family: var(--f-mono); font-size: 12px; }
.mk { border-radius: 4px; padding: 1px 6px; }
.mk.y { background: var(--ok-soft); color: var(--ok); } .mk.x { background: var(--bad-soft); color: var(--bad); }
@media (max-width: 480px) { .res { grid-template-columns: 1fr auto; } .res .m { grid-column: 1 / -1; grid-row: 2; } }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: translateY(4px); opacity: .6; } to { transform: none; opacity: 1; } }
.appear { animation: pop .22s ease-out; }
</style>

<div class="wrap" id="app"></div>

<script>
// ---------------- data ----------------
const POS = [
  { k: "n",    en: "Noun",        th: "คำนาม" },
  { k: "v",    en: "Verb",        th: "คำกริยา" },
  { k: "adj",  en: "Adjective",   th: "คุณศัพท์" },
  { k: "adv",  en: "Adverb",      th: "กริยาวิเศษณ์" },
  { k: "prep", en: "Preposition", th: "บุพบท" },
  { k: "conj", en: "Conjunction", th: "คำสันธาน" },
  { k: "pron", en: "Pronoun",     th: "สรรพนาม" },
];
const POSMAP = Object.fromEntries(POS.map(p => [p.k, p]));

const DECKS = [
  { k: "office",    th: "ออฟฟิศ" },
  { k: "finance",   th: "การเงิน" },
  { k: "hr",        th: "บุคคล / HR" },
  { k: "travel",    th: "เดินทาง" },
  { k: "marketing", th: "การตลาด" },
  { k: "grammar",   th: "คำเชื่อม & บุพบท" },
];

// w: word, p: parts of speech, th: Thai meaning, ex: example, f: word family [form, pos], g: synonym group (not used as distractors for each other), tip
const WORDS = [
  // office
  { d:"office", w:"attendance", p:["n"], th:"การเข้าร่วม", ex:"Attendance at the safety workshop is mandatory for all staff.", f:[["attend","v"],["attendee","n"],["attentive","adj"]] },
  { d:"office", w:"mandatory", p:["adj"], th:"ที่บังคับ, ต้องทำ", ex:"Safety training is mandatory for new employees.", f:[["mandate","n"],["mandatorily","adv"]] },
  { d:"office", w:"postpone", p:["v"], th:"เลื่อนออกไป", ex:"We had to postpone the product launch until May." },
  { d:"office", w:"punctual", p:["adj"], th:"ตรงต่อเวลา", ex:"Ms. Lee is always punctual for client meetings.", f:[["punctually","adv"],["punctuality","n"]] },
  { d:"office", w:"colleague", p:["n"], th:"เพื่อนร่วมงาน", ex:"Please share the report with your colleague in accounting." },
  { d:"office", w:"supervise", p:["v"], th:"ควบคุมดูแล", ex:"Mr. Park will supervise the new interns this summer.", f:[["supervisor","n"],["supervision","n"],["supervisory","adj"]] },
  { d:"office", w:"efficiently", p:["adv"], th:"อย่างมีประสิทธิภาพ", ex:"The new software helps us process orders more efficiently.", f:[["efficient","adj"],["efficiency","n"]] },
  { d:"office", w:"submit", p:["v"], th:"ยื่น, ส่ง (เอกสาร)", ex:"Please submit your expense report by Friday.", f:[["submission","n"]] },
  { d:"office", w:"temporarily", p:["adv"], th:"ชั่วคราว", ex:"The east entrance is temporarily closed for repairs.", f:[["temporary","adj"]] },
  { d:"office", w:"announcement", p:["n"], th:"การประกาศ, คำประกาศ", ex:"The CEO made an announcement about the merger.", f:[["announce","v"],["announcer","n"]] },
  { d:"office", w:"equipment", p:["n"], th:"อุปกรณ์", ex:"All office equipment must be returned before you leave.", f:[["equip","v"],["equipped","adj"]] },
  { d:"office", w:"confidential", p:["adj"], th:"เป็นความลับ", ex:"Client records are strictly confidential.", f:[["confidentiality","n"],["confidentially","adv"]] },
  // finance
  { d:"finance", w:"invoice", p:["n"], th:"ใบแจ้งหนี้", ex:"The invoice must be paid within 30 days." },
  { d:"finance", w:"reimburse", p:["v"], th:"จ่ายเงินคืน, ชดใช้เงิน", ex:"The company will reimburse you for travel expenses.", f:[["reimbursement","n"]] },
  { d:"finance", w:"revenue", p:["n"], th:"รายได้", ex:"Annual revenue rose by 12 percent last year." },
  { d:"finance", w:"budget", p:["n","v"], th:"งบประมาณ", ex:"The marketing budget was cut in half." },
  { d:"finance", w:"profitable", p:["adj"], th:"ทำกำไร, มีกำไร", ex:"The new branch became profitable within a year.", f:[["profit","n"],["profitability","n"],["profitably","adv"]] },
  { d:"finance", w:"expenditure", p:["n"], th:"รายจ่าย, การใช้จ่าย", ex:"We need to reduce our expenditure on office supplies.", f:[["expend","v"]] },
  { d:"finance", w:"approximately", p:["adv"], th:"ประมาณ", ex:"The renovation will take approximately three weeks.", f:[["approximate","adj"],["approximation","n"]] },
  { d:"finance", w:"substantial", p:["adj"], th:"จำนวนมาก, อย่างมาก", ex:"The firm received a substantial increase in orders.", f:[["substantially","adv"],["substance","n"]] },
  { d:"finance", w:"audit", p:["n","v"], th:"การตรวจสอบบัญชี", ex:"An external audit is conducted every spring.", f:[["auditor","n"]] },
  { d:"finance", w:"fiscal", p:["adj"], th:"เกี่ยวกับการคลัง, ปีงบประมาณ", ex:"Sales targets for the next fiscal year have been set." },
  { d:"finance", w:"deduct", p:["v"], th:"หัก (เงิน)", ex:"The bank will deduct a small fee from your account.", f:[["deduction","n"],["deductible","adj"]] },
  { d:"finance", w:"financially", p:["adv"], th:"ในทางการเงิน", ex:"The expansion plan is not financially feasible this year.", f:[["finance","n"],["financial","adj"]] },
  // hr

// ---------------- helpers ----------------
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const tag = k => `<span class="tag t-${k}">${k}.</span>`;
const wordRe = w => new RegExp("\\b" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "\\b", "i");
const part5Ok = x => x.f && x.f.length >= 2 && wordRe(x.w).test(x.ex);

function suffixClue(x) {
  if (x.d === "grammar" || x.w.includes(" ")) return null;
  const r = SUFFIX.find(([s]) => x.w.toLowerCase().endsWith(s));
  if (!r) return { html: "คำนี้ไม่มีคำลงท้ายที่ช่วยบอกประเภท ต้องจำจากการใช้ในประโยค", warn: false };
  const [s, pos, sample] = r;
  if (x.p.includes(pos)) return { html: `ลงท้ายด้วย <span class="sx">-${s}</span> มักเป็น <b>${POSMAP[pos].en}</b> เหมือน ${sample}`, warn: false };
  return { html: `ระวัง: <span class="sx">-${s}</span> ปกติเป็น ${POSMAP[pos].en} แต่ <b>${esc(x.w)}</b> เป็น <b>${x.p.map(p => POSMAP[p].en).join(" / ")}</b> ข้อนี้เป็นข้อยกเว้น ต้องจำ`, warn: true };
}

function meaningChoices(x) {
  const pool = WORDS.filter(o => o !== x && !(x.g && o.g === x.g) && o.th !== x.th);
  const same = shuffle(pool.filter(o => o.p.some(p => x.p.includes(p))));
  const other = shuffle(pool.filter(o => !o.p.some(p => x.p.includes(p))));
  const picks = [];
  for (const o of [...same, ...other]) { if (picks.length === 3) break; if (!picks.some(p => p.th === o.th)) picks.push(o); }
  return shuffle([x, ...picks]).map(o => ({ th: o.th, ok: o === x }));
}
function part5Choices(x) {
  return shuffle([[x.w, x.p[0], true], ...shuffle(x.f).slice(0, 3).map(([w, p]) => [w, p, false])]);
}

// ---------------- state ----------------
let S = { view: "home" };

function poolFor(mode, decks) {
  return WORDS.filter(x => decks.includes(x.d) && (mode !== "part5" || part5Ok(x)));
}
function startSession(words) {
  const mode = MODES.find(m => m.k === store.mode);
  let list = words;
  if (!list) {
    // lower Leitner boxes first, random within a box
    list = shuffle(poolFor(store.mode, store.decks)).sort((a, b) => boxOf(a.w) - boxOf(b.w)).slice(0, store.len);
  }
  S = { view: "quiz", mode, queue: shuffle(list).map(x => makeCard(x, false)), i: 0, results: new Map() };
  renderQuiz();
}
function makeCard(x, retry) {
  return { x, retry, stepIdx: 0, pos: null, meaning: null, part5: null,
    mChoices: meaningChoices(x), pChoices: x.f ? part5Choices(x) : null };
}

          </tbody>
        </table></div>
        <p class="note">ข้อยกเว้นที่ควรรู้: itinerary (-ary แต่เป็น noun), friendly / timely (-ly แต่เป็น adjective), regarding (-ing แต่เป็น preposition), however / nevertheless เป็น adverb ไม่ใช่ conjunction</p>
      </div>
    </details>`;

  document.querySelectorAll("[data-mode]").forEach(b => b.onclick = () => { store.mode = b.dataset.mode; save(); renderHome(); });
  document.querySelectorAll("[data-deck]").forEach(b => b.onclick = () => {
    const k = b.dataset.deck; const s = new Set(store.decks); s.has(k) ? s.delete(k) : s.add(k); store.decks = [...s]; save(); renderHome();
  });
  $("#deck-all").onclick = () => { store.decks = DECKS.map(d => d.k); save(); renderHome(); };
  document.querySelectorAll("[data-len]").forEach(b => b.onclick = () => { store.len = +b.dataset.len; save(); renderHome(); });
  $("#start").onclick = () => startSession();
}

function renderQuiz() {
  const c = S.queue[S.i], x = c.x, steps = S.mode.steps;
  const step = steps[c.stepIdx]; // undefined => reveal
  const done = !step;
  const firstCount = S.queue.filter(q => !q.retry).length;
  const doneCount = S.i + (done ? 1 : 0);
  const stepNames = { pos: "ประเภทคำ", meaning: "ความหมาย", part5: "เติมคำ" };

  let head = "";
  if (S.mode.k === "part5") {
    const blanked = esc(x.ex).replace(wordRe(esc(x.w)), `<span class="blank">${done ? esc(x.ex.match(wordRe(x.w))[0]) : "&nbsp;"}</span>`);
    head = `<p class="sentence">${blanked}</p><p class="note">${esc(x.th)} · เลือกรูปคำที่ถูกต้องเติมในช่องว่าง</p>`;
  } else {
    head = `<h2 class="word">${esc(x.w)}</h2>`;
  }

  const showPos = steps.includes("pos");
  const showMeaning = steps.includes("meaning") && (c.stepIdx >= steps.indexOf("meaning"));

  let html = `
    <div class="qbar">
      <span class="count">${Math.min(doneCount, S.queue.length)} / ${S.queue.length}</span>
      <div class="track"><i style="width:${(doneCount / S.queue.length * 100).toFixed(1)}%"></i></div>
      <button class="quit" id="quit">ออก</button>
    </div>
    <article class="card">
      <div class="card-meta">
        <span class="label">${DECKS.find(d => d.k === x.d).th}${c.retry ? ` · <span class="retry">ทวนอีกครั้ง</span>` : ""}</span>
        <div class="steps">${steps.map((s, i) => `<span class="${i < c.stepIdx ? "done" : i === c.stepIdx ? "on" : ""}">${i + 1} ${stepNames[s]}</span>`).join("")}</div>
      </div>
      ${head}`;

  if (showPos) {
    const answered = c.pos !== null;
    html += `<section class="step">
      <p class="prompt">คำนี้เป็นคำประเภทอะไร? <small>กด 1–7</small></p>
      <div class="posgrid">${POS.map((p, i) => {
        let cls = "";
        if (answered) cls = x.p.includes(p.k) ? "right" : (c.pos === p.k ? "wrong" : "dim");
        return `<button class="opt pos-opt ${cls}" id="pos-${p.k}" data-pos="${p.k}" ${answered ? "disabled" : ""}>
          <span class="bub">${i + 1}</span><span class="txt"><b>${p.en}</b><small>${p.th}</small></span></button>`;
      }).join("")}</div>
      ${answered ? verdict(x.p.includes(c.pos), `${x.p.map(p => POSMAP[p].en).join(" / ")}`) : ""}
    </section>`;
  }

  if (showMeaning) {
    const answered = c.meaning !== null;
    html += `<section class="step appear">
      <p class="prompt">ความหมายคือ? <small>กด A–D หรือ 1–4</small></p>
      <div class="opts">${c.mChoices.map((o, i) => {
        let cls = "";
        if (answered) cls = o.ok ? "right" : (c.meaning === i ? "wrong" : "dim");
        return `<button class="opt ${cls}" id="m-${i}" data-m="${i}" ${answered ? "disabled" : ""}>
          <span class="bub">${"ABCD"[i]}</span><span class="txt"><b>${esc(o.th)}</b></span></button>`;
      }).join("")}</div>
    </section>`;
  }

  if (steps.includes("part5")) {
    const answered = c.part5 !== null;
    html += `<section class="step">
      <p class="prompt">คำไหนเหมาะกับช่องว่าง? <small>กด A–D หรือ 1–4</small></p>
      <div class="opts">${c.pChoices.map(([w, p, ok], i) => {
        let cls = "";
        if (answered) cls = ok ? "right" : (c.part5 === i ? "wrong" : "dim");
        return `<button class="opt ${cls}" id="p5-${i}" data-p5="${i}" ${answered ? "disabled" : ""}>
          <span class="bub">${"ABCD"[i]}</span><span class="txt"><span class="en">${esc(w)}</span></span>${answered ? `<span class="side">${tag(p)}</span>` : ""}</button>`;
      }).join("")}</div>
      ${answered ? verdict(c.pChoices[c.part5][2], `${x.w} (${POSMAP[x.p[0]].en})`) : ""}
    </section>`;
  }

  if (done) html += revealHtml(c);
  html += `</article>`;
  if (done) html += `<div class="nextrow"><button class="btn" id="next">${S.i + 1 < S.queue.length ? "คำถัดไป" : "ดูสรุปผล"} <kbd>Enter</kbd></button></div>`;

  $("#app").innerHTML = html;
  $("#quit").onclick = renderHome;
  document.querySelectorAll("[data-pos]").forEach(b => b.onclick = () => answer("pos", b.dataset.pos));
  document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => answer("meaning", +b.dataset.m));
  document.querySelectorAll("[data-p5]").forEach(b => b.onclick = () => answer("part5", +b.dataset.p5));
  if (done) { $("#next").onclick = next; $("#next").focus({ preventScroll: true }); }
}

function verdict(ok, correct) {
  return ok ? `<p class="verdict ok">✓ ถูกต้อง</p>` : `<p class="verdict bad">✗ คำตอบคือ ${esc(correct)}</p>`;
}

function revealHtml(c) {
  const x = c.x, clue = suffixClue(x);
  const ex = esc(x.ex).replace(wordRe(esc(x.w)), m => `<mark>${m}</mark>`);
  let rows = `
    <div class="row"><span class="label">คำตอบ</span><div class="ans"><span>${esc(x.w)}</span>${x.p.map(tag).join("")}<span>— ${esc(x.th)}</span></div></div>`;
  if (S.mode.k !== "part5") rows += `<div class="row"><span class="label">ตัวอย่าง</span><div class="ex">${ex}</div></div>`;
  if (clue) rows += `<div class="row"><span class="label">เบาะแส</span><div class="clue ${clue.warn ? "warn" : ""}">${clue.html}</div></div>`;
  if (x.f) rows += `<div class="row"><span class="label">Word family</span><div class="fam">
      <span class="me">${esc(x.w)} ${tag(x.p[0])}</span>${x.f.map(([w, p]) => `<span>${esc(w)} ${tag(p)}</span>`).join("")}</div></div>`;
  if (x.tip) rows += `<div class="tip">${esc(x.tip)}</div>`;
  return `<section class="reveal appear">${rows}</section>`;
}

function answer(kind, val) {
  const c = S.queue[S.i];
  if (c[kind] !== null || S.mode.steps[c.stepIdx] !== kind) return;
  c[kind] = val;
  c.stepIdx++;
  if (!S.mode.steps[c.stepIdx]) finishCard(c);
  renderQuiz();
}

function cardCorrect(c) {
  const x = c.x, r = {};
  if (c.pos !== null) r.pos = x.p.includes(c.pos);
  if (c.meaning !== null) r.meaning = c.mChoices[c.meaning].ok;
  if (c.part5 !== null) r.part5 = c.pChoices[c.part5][2];
  return r;
}
function finishCard(c) {
  const r = cardCorrect(c), ok = Object.values(r).every(Boolean);
  if (!c.retry) {
    S.results.set(c.x.w, { x: c.x, r });
    store.boxes[c.x.w] = ok ? Math.min(5, boxOf(c.x.w) + 1) : 1;
    save();
  }
  if (!ok && !c.retry) S.queue.push(makeCard(c.x, true));
}

function next() {
  if (S.i + 1 < S.queue.length) { S.i++; renderQuiz(); window.scrollTo({ top: 0 }); }
  else renderSummary();
}

function renderSummary() {
  const res = [...S.results.values()];
  const good = res.filter(o => Object.values(o.r).every(Boolean)).length;
  const wrong = res.filter(o => !Object.values(o.r).every(Boolean)).map(o => o.x);
  const lbl = { pos: "ประเภท", meaning: "ความหมาย", part5: "เติมคำ" };
  S.view = "summary";
  $("#app").innerHTML = `
    <header class="brand"><div><p class="label">สรุปรอบนี้ · ${esc(S.mode.th)}</p><h1>Vocab <span>Drill</span></h1></div></header>
    <div class="score">
      <div class="big">${good}<small> / ${res.length}</small></div>
      <p>${good === res.length ? "ถูกครบทุกคำ คำเหล่านี้ขยับขึ้นกล่องแล้ว" : `ตอบผิด ${wrong.length} คำ คำเหล่านี้กลับไปอยู่กล่อง 1 และจะถูกเลือกก่อนในรอบหน้า`}</p>
    </div>
    <div class="reslist">${res.map(o => `
      <div class="res">
        <span class="w">${esc(o.x.w)} ${o.x.p.map(tag).join(" ")}</span>
        <span class="m">${esc(o.x.th)}</span>
        <span class="marks">${Object.entries(o.r).map(([k, v]) => `<span class="mk ${v ? "y" : "x"}">${v ? "✓" : "✗"} ${lbl[k]}</span>`).join("")}</span>
      </div>`).join("")}
    </div>
    <div class="btnrow">
      ${wrong.length ? `<button class="btn" id="again-wrong">ทวนคำที่ผิด ${wrong.length} คำ</button>` : ""}
      <button class="btn ${wrong.length ? "ghost" : ""}" id="again">เริ่มรอบใหม่</button>
      <button class="btn ghost" id="home">กลับหน้าแรก</button>
    </div>`;
  if (wrong.length) $("#again-wrong").onclick = () => startSession(wrong);
  $("#again").onclick = () => startSession();
  $("#home").onclick = renderHome;
}

// ---------------- keyboard ----------------
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.view === "home" && e.key === "Enter" && document.activeElement === document.body) { $("#start") && !$("#start").disabled && startSession(); return; }
  if (S.view !== "quiz") return;
  const c = S.queue[S.i], step = S.mode.steps[c.stepIdx];
  if (!step) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); next(); } return; }
  const k = e.key.toLowerCase();
  if (step === "pos") { const n = +k; if (n >= 1 && n <= 7) answer("pos", POS[n - 1].k); }
  else {
    let idx = "abcd".indexOf(k); if (idx < 0 && +k >= 1 && +k <= 4) idx = +k - 1;
    if (idx >= 0) answer(step, idx);
  }
});

renderHome();
</script>
